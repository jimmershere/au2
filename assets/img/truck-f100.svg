<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ford F-100 bumpside pickup — chrome and red line art">
  <defs>
    <linearGradient id="chromeF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#cfd2d8"/>
      <stop offset=".52" stop-color="#83868d"/>
      <stop offset=".66" stop-color="#e8eaee"/>
      <stop offset="1" stop-color="#9a9da4"/>
    </linearGradient>
    <linearGradient id="bodyF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset=".5" stop-color="#101012"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="glassF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3a3d42" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="redF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d0d13"/>
      <stop offset=".5" stop-color="#d81a24"/>
      <stop offset="1" stop-color="#7d0d13"/>
    </linearGradient>
    <radialGradient id="shadowF" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="480" cy="424" rx="380" ry="26" fill="url(#shadowF)"/>

  <!-- red accent swoosh -->
  <path d="M70 436 H890" stroke="url(#redF)" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 452 H840" stroke="url(#chromeF)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <!-- body (facing LEFT), rounded bumpside fenders -->
  <path d="M840 330
           L840 262
           Q840 254 830 252
           L812 248
           L802 192
           Q800 180 788 178
           L636 168
           L570 110
           Q564 104 554 104
           L404 104
           Q392 104 390 114
           L380 168
           L134 180
           Q120 182 118 194
           L110 250
           Q96 254 94 262
           L94 330
           Q94 340 104 340
           L146 340
           A74 74 0 0 1 294 340
           L640 340
           A74 74 0 0 1 788 340
           L830 340
           Q840 340 840 330 Z"
        fill="url(#bodyF)" stroke="url(#chromeF)" stroke-width="6" stroke-linejoin="round"/>

  <!-- windshield + door glass -->
  <path d="M558 118 L406 118 Q398 118 396 126 L388 166 L620 166 Z" fill="url(#glassF)"/>
  <path d="M462 118 L458 166" stroke="#101012" stroke-width="7"/>

  <!-- door seam + handle -->
  <path d="M492 172 L494 336" stroke="#3a3d42" stroke-width="3"/>
  <rect x="436" y="216" width="34" height="7" rx="3.5" fill="url(#chromeF)"/>

  <!-- signature bumpside body crease: chrome spear with red inlay -->
  <path d="M104 236 Q470 224 828 236" stroke="url(#chromeF)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M104 236 Q470 226 828 236" stroke="url(#redF)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- bed rail hint -->
  <path d="M370 174 H126" stroke="#3a3d42" stroke-width="3"/>

  <!-- front detail: horizontal-bar grille + headlight + bumper (left side) -->
  <rect x="96" y="284" width="30" height="8" rx="3" fill="url(#chromeF)"/>
  <rect x="96" y="298" width="30" height="8" rx="3" fill="url(#chromeF)" opacity=".8"/>
  <rect x="96" y="312" width="30" height="8" rx="3" fill="url(#chromeF)" opacity=".6"/>
  <circle cx="112" cy="244" r="12" fill="url(#glassF)" stroke="url(#chromeF)" stroke-width="3"/>
  <path d="M130 344 H76 Q66 344 66 336 L66 330" stroke="url(#chromeF)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- rear bumper -->
  <path d="M800 344 H852 Q862 344 862 336 L862 330" stroke="url(#chromeF)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- wheels: deep-dish 5-spoke -->
  <g>
    <circle cx="220" cy="340" r="72" fill="#0a0a0b" stroke="#2c2c30" stroke-width="10"/>
    <circle cx="220" cy="340" r="44" fill="#141416" stroke="url(#chromeF)" stroke-width="6"/>
    <g stroke="url(#chromeF)" stroke-width="7" stroke-linecap="round">
      <path d="M220 340 L220 304"/><path d="M220 340 L254 329"/><path d="M220 340 L241 369"/>
      <path d="M220 340 L199 369"/><path d="M220 340 L186 329"/>
    </g>
    <circle cx="220" cy="340" r="9" fill="url(#chromeF)"/>
  </g>
  <g>
    <circle cx="714" cy="340" r="72" fill="#0a0a0b" stroke="#2c2c30" stroke-width="10"/>
    <circle cx="714" cy="340" r="44" fill="#141416" stroke="url(#chromeF)" stroke-width="6"/>
    <g stroke="url(#chromeF)" stroke-width="7" stroke-linecap="round">
      <path d="M714 340 L714 304"/><path d="M714 340 L748 329"/><path d="M714 340 L735 369"/>
      <path d="M714 340 L693 369"/><path d="M714 340 L680 329"/>
    </g>
    <circle cx="714" cy="340" r="9" fill="url(#chromeF)"/>
  </g>

  <!-- hood highlight -->
  <path d="M360 98 Q320 90 260 94" stroke="#f4f4f6" stroke-width="3" opacity=".5" fill="none"/>
</svg>
